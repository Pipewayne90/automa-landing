<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Automa — Procesos que se manejan solos">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="78%" cy="82%" r="42%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#030305"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Wordmark -->
  <text x="600" y="222"
        font-family="Syne, 'Trebuchet MS', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="90" font-weight="800" letter-spacing="-3"
        text-anchor="middle" fill="#F9FAFB">Automa</text>

  <!-- Accent rule under the wordmark -->
  <rect x="510" y="252" width="180" height="2" fill="url(#rule)"/>

  <!-- Headline -->
  <text x="600" y="360"
        font-family="Syne, 'Trebuchet MS', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="-1.4"
        text-anchor="middle" fill="#F9FAFB">Procesos que se manejan</text>
  <text x="600" y="420"
        font-family="Syne, 'Trebuchet MS', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="-1.4"
        text-anchor="middle" fill="#10B981">solos.</text>

  <!-- Domain -->
  <text x="600" y="552"
        font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="500" letter-spacing="1"
        text-anchor="middle" fill="#6B7280">flowautoma.com</text>
</svg>
