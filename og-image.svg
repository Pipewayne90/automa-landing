<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Automa — La IA hace lo repetitivo. Tú sigues al mando.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="8%" r="62%">
      <stop offset="0%"   stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="55%"  stop-color="#059669" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Wordmark -->
  <text x="600" y="196"
        font-family="Instrument Serif, Georgia, serif"
        font-size="68" font-weight="400" letter-spacing="-1"
        text-anchor="middle" fill="#0A0E17">Automa</text>

  <!-- Accent rule -->
  <rect x="570" y="232" width="60" height="2" fill="#059669"/>

  <!-- Headline, two lines -->
  <text x="600" y="342"
        font-family="Instrument Serif, Georgia, serif"
        font-size="76" font-weight="400" letter-spacing="-1.5"
        text-anchor="middle" fill="#0A0E17">La IA hace lo repetitivo.</text>
  <text x="600" y="428"
        font-family="Instrument Serif, Georgia, serif"
        font-size="76" font-weight="400" letter-spacing="-1.5"
        text-anchor="middle" fill="#0A0E17">Tú sigues <tspan font-style="italic" fill="#059669">al mando.</tspan></text>

  <!-- Domain -->
  <text x="600" y="548"
        font-family="Geist Mono, ui-monospace, Menlo, monospace"
        font-size="20" font-weight="500" letter-spacing="2"
        text-anchor="middle" fill="#5B6472">FLOWAUTOMA.COM</text>
