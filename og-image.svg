<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Automa — Procesos que se manejan solos">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="58%">
      <stop offset="0%"   stop-color="#10B981" stop-opacity="0.13"/>
      <stop offset="52%"  stop-color="#10B981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="16%" cy="88%" r="42%">
      <stop offset="0%"   stop-color="#3B82F6" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#04060B"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>

  <!-- Wordmark -->
  <text x="600" y="250"
        font-family="Syne, Inter, Helvetica, Arial, sans-serif"
        font-size="88" font-weight="800" letter-spacing="-3"
        text-anchor="middle" fill="#F8FAFC">Automa</text>

  <!-- Accent rule under the wordmark -->
  <rect x="555" y="286" width="90" height="2" fill="#10B981"/>

  <!-- Headline -->
  <text x="600" y="380"
        font-family="Syne, Inter, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1.3"
        text-anchor="middle" fill="#F8FAFC">Procesos que se manejan <tspan fill="#10B981">solos.</tspan></text>

  <!-- Domain -->
  <text x="600" y="540"
        font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="500" letter-spacing="1"
        text-anchor="middle" fill="#64748B">flowautoma.com</text>
</svg>
