<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Automa — La IA hace lo repetitivo. Tú sigues al mando.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="8%" r="62%">
      <stop offset="0%"   stop-color="#059669" stop-opacity="0.14"/>
      <stop offset="55%"  stop-color="#059669" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Wordmark -->
  <text x="600" y="230"
        font-family="Syne, Inter, Helvetica, Arial, sans-serif"
        font-size="84" font-weight="800" letter-spacing="-3"
        text-anchor="middle" fill="#0A0E17">Automa</text>

  <!-- Accent rule -->
  <rect x="555" y="266" width="90" height="3" fill="#059669"/>

  <!-- Headline, two lines -->
  <text x="600" y="350"
        font-family="Syne, Inter, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1.3"
        text-anchor="middle" fill="#0A0E17">La IA hace lo repetitivo.</text>
  <text x="600" y="410"
        font-family="Syne, Inter, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1.3"
        text-anchor="middle" fill="#0A0E17">Tú sigues <tspan fill="#059669">al mando.</tspan></text>

  <!-- Domain -->
  <text x="600" y="550"
        font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="500" letter-spacing="1"
        text-anchor="middle" fill="#5B6472">flowautoma.com</text>
</svg>
